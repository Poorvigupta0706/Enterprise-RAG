[project]
name = "enterprise-rag"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastembed>=0.8.0",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "rag-pipeline>=0.1.3",
    "ragas>=0.4.3",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools]
py-modules = [
    "config",
    "hybrid",
    "indexing",
    "pipeline",
    "reranker",
    "cache",
    "llm",
    "run_eval"
]